services:
  - type: web
    name: home-and-verse
    runtime: python
    buildCommand: npm install && npm run build && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "20"
      # Note: DATABASE_URL must be set manually in Render dashboard
      # Copy value from dm-sales-app environment if using shared cache
      # Without it, the app uses local products.json for item lookups
    autoDeploy: true
